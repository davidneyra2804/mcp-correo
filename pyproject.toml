[project]
name = "vyr-mail-mcp"
version = "0.2.0"
description = "Servidor MCP de correo: lectura IMAP y escritura bajo confirmación"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
