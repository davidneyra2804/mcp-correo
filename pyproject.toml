[project]
name = "mcp-correo"
version = "1.1.0"
description = "Servidor MCP de correo: lectura IMAP y escritura bajo confirmación"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# El runner de Actions activa PYTHONSAFEPATH y no mete el directorio
# de trabajo en sys.path. Sin esto, `import audit` falla solo en CI.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
