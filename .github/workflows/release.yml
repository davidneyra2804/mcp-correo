name: release

# Publica la imagen y crea el Release de GitHub a partir de una etiqueta.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# La etiqueta es la que manda: el número tiene que coincidir con
# version.py o el workflow falla antes de publicar nada.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # crear el Release
  packages: write # publicar la imagen en GHCR

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check . && ruff format --check .

      - name: Pytest
        run: pytest

      - name: La etiqueta tiene que coincidir con la versión
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$VERSION" != "$(python -c 'from version import __version__; print(__version__)')" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con version.py" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MCP_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crear el Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## Imagen

            ```
            ${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ```

            En Portainer, para usar la imagen publicada:

            ```
            MCP_IMAGE=${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            MCP_PULL_POLICY=always
            ```
