# Stack de Portainer. Toda la configuración va en variables de entorno:
# en el formulario del stack, en "Load variables from .env file", o en un
# fichero .env junto al compose.
#
# Este es el stack base: el MCP, el panel de control y la rotación de la
# auditoría.
#
#   docker-compose.tunnel.yml   Cloudflare Tunnel. No hace falta abrir
#                                ningún puerto en el host.
#   docker-compose.proxy.yml     Caddy con TLS propio (Let's Encrypt).
#
# En Portainer se añaden como "Additional paths", que es lo mismo que
# pasar varios -f a docker compose.
#
# La imagen local se llama mcp-correo:local y no está en un registro.
# Portainer ejecuta `docker compose pull` antes de `up`: pull_policy
# build/never hace que ese pull no la busque.
# Imagen ya publicada: MCP_IMAGE=registro/mcp-correo:1 y MCP_PULL_POLICY=always.
#
# El contenedor escucha en 0.0.0.0:8765 porque el proxy o el túnel llegan
# por la red de Docker. El puerto del host sale solo en 127.0.0.1.
#
# El panel escucha en 0.0.0.0:8766 y su puerto sale también en 127.0.0.1.
# El panel ve las contraseñas de las cuentas: no lo publiques fuera de
# loopback.
#
# La base de datos va en el volumen de datos, en /var/lib/mcp-correo. Sin
# ese volumen el contenedor es de solo lectura y la base no se puede
# escribir: las cuentas se perderían en cada reinicio.
#
# No pongas secretos en este archivo: Portainer los rellena como ${VAR}.
# El contrato completo de variables está en docs/configuracion.md.

services:
  mcp:
    container_name: mcp-correo
    image: ${MCP_IMAGE:-mcp-correo:local}
    pull_policy: ${MCP_PULL_POLICY:-build}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    # De dónde salen las variables del contenedor.
    #
    # stack.env: lo escribe Portainer con todas las variables del stack (las
    # que defines a mano y las del .env que subes). Es lo que hace llegar
    # las variables MCP_ACCOUNT_<CAMPO>_<N> sin enumerarlas una a una.
    #
    # .env: el fichero del directorio del compose. Lo lee compose para
    # interpolar y, además, lo metemos aquí para que las variables también
    # lleguen al contenedor cuando se despliega en local, donde no hay
    # stack.env.
    #
    # Los dos son opcionales: si el que exista se usa, y si faltan los dos,
    # el proceso avisa de que no hay configuración.
    # Compose 2.24 o superior.
    env_file:
      - path: ${MCP_STACK_ENV_FILE:-stack.env}
        required: false
      - path: .env
        required: false
    environment:
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:?Define MCP_BEARER_TOKEN en las variables del stack}
      MCP_BIND_HOST: 0.0.0.0
      MCP_BIND_PORT: "8765"
      MCP_ALLOW_NONLOCAL_BIND: "1"
      MCP_AUDIT_LOG: /var/log/mcp-correo/audit.jsonl
      # Cuentas. No hay que declarar nada: el servidor las descubre por
      # los indices de MCP_ACCOUNT_<CAMPO>_<N>, que llegan por env_file.
      #
      # Estas se importan a la base de datos una vez, si la base está
      # vacía, y a partir de ahí manda la base. Ver docs/dashboard.md.
      # Interruptores globales. Apagados por defecto.
      MCP_ENABLE_SEND: ${MCP_ENABLE_SEND:-false}
      MCP_ENABLE_MARK: ${MCP_ENABLE_MARK:-false}
      MCP_ENABLE_DELETE: ${MCP_ENABLE_DELETE:-false}
      MCP_ENABLE_DRAFTS: ${MCP_ENABLE_DRAFTS:-false}
      # Red. MCP_PUBLIC_HOST arma allowed_hosts y allowed_origins; las
      # listas explícitas los sustituyen.
      MCP_PUBLIC_HOST: ${MCP_PUBLIC_HOST:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      # Límites. El cliente no puede subirlos.
      MCP_MAX_RESULTS: ${MCP_MAX_RESULTS:-100}
      MCP_MAX_CHARS: ${MCP_MAX_CHARS:-20000}
      MCP_MAX_ATTACHMENT_BYTES: ${MCP_MAX_ATTACHMENT_BYTES:-5000000}
      MCP_MAX_MESSAGE_BYTES: ${MCP_MAX_MESSAGE_BYTES:-15000000}
      MCP_IMAP_TIMEOUT: ${MCP_IMAP_TIMEOUT:-20}
      MCP_SENT_SCAN_LIMIT: ${MCP_SENT_SCAN_LIMIT:-300}
      MCP_CONFIRM_TTL_SECONDS: ${MCP_CONFIRM_TTL_SECONDS:-600}
      MCP_MAX_RECIPIENTS: ${MCP_MAX_RECIPIENTS:-10}
      MCP_MAX_SENDS_PER_DAY: ${MCP_MAX_SENDS_PER_DAY:-30}
      MCP_MAX_DELETE_PER_CALL: ${MCP_MAX_DELETE_PER_CALL:-20}
      MCP_MAX_MARK_PER_CALL: ${MCP_MAX_MARK_PER_CALL:-50}
      MCP_SMTP_TIMEOUT: ${MCP_SMTP_TIMEOUT:-30}
      MCP_SMTP_SECURITY: ${MCP_SMTP_SECURITY:-ssl}
      MCP_ALLOWED_RECIPIENT_DOMAINS: ${MCP_ALLOWED_RECIPIENT_DOMAINS:-}
      MCP_ALLOWED_ATTACHMENT_TYPES: ${MCP_ALLOWED_ATTACHMENT_TYPES:-}
      # Panel de control. Siempre está: es la forma de gestionar las
      # cuentas. La base de datos vive en el volumen de datos, así que
      # sobrevive a los reinicios y a los redespliegues.
      #
      # MCP_DASHBOARD_KEY cifra las contraseñas de las cuentas. No está en
      # la base de datos: si se pierde, las contraseñas guardadas no se
      # pueden descifrar. Guárdala aparte.
      MCP_DASHBOARD_DB: ${MCP_DASHBOARD_DB:-/var/lib/mcp-correo/cuentas.db}
      MCP_DASHBOARD_KEY: ${MCP_DASHBOARD_KEY:?Define MCP_DASHBOARD_KEY en las variables del stack}
      MCP_DASHBOARD_TOKEN: ${MCP_DASHBOARD_TOKEN:?Define MCP_DASHBOARD_TOKEN en las variables del stack}
      MCP_DASHBOARD_BIND_HOST: 0.0.0.0
      MCP_DASHBOARD_BIND_PORT: "8766"
    ports:
      - "${MCP_PUBLISH_BIND:-127.0.0.1}:${MCP_PUBLISH_PORT:-8765}:8765"
      # El panel, solo en loopback. No lo publiques tal cual: el puerto del
      # host sale en 127.0.0.1 y quien lo abra tiene las contraseñas.
      - "${MCP_DASHBOARD_PUBLISH_BIND:-127.0.0.1}:${MCP_DASHBOARD_PUBLISH_PORT:-8766}:8766"
    volumes:
      - audit:/var/log/mcp-correo
      # La base de datos de las cuentas. El contenedor es de solo lectura:
      # sin este volumen, la base no se puede escribir.
      - data:/var/lib/mcp-correo
    # Etiquetas Traefik, opcionales. Sustituye el dominio y la red del proxy.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.mcp-correo.rule=Host(`mcp.example.com`)"
    #   - "traefik.http.routers.mcp-correo.entrypoints=websecure"
    #   - "traefik.http.routers.mcp-correo.tls=true"
    #   - "traefik.http.routers.mcp-correo.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.mcp-correo.loadbalancer.server.port=8765"
    #   - "traefik.docker.network=proxy"
    # networks:
    #   - default
    #   - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          pids: 128
        reservations:
          memory: 64M

  audit-rotate:
    container_name: mcp-correo-audit-rotate
    image: ${MCP_IMAGE:-mcp-correo:local}
    # Misma imagen que mcp. Sin build propio: se construye una sola vez.
    # never: el pull de Portainer no busca mcp-correo:local en un registro.
    pull_policy: ${MCP_PULL_POLICY:-never}
    depends_on:
      - mcp
    entrypoint: ["python", "/app/docker/rotate_audit.py"]
    command: ["--loop"]
    # El HEALTHCHECK de la imagen espera un servidor HTTP en el 8765 y en
    # el 8766 del panel. Este servicio no sirve HTTP: es un bucle que vigila
    # el fichero. Sin esto el contenedor quedaría "unhealthy" para siempre,
    # con Connection refused.
    healthcheck:
      disable: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    memswap_limit: 64m
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      MCP_AUDIT_LOG: /var/log/mcp-correo/audit.jsonl
      MCP_AUDIT_MAX_BYTES: ${MCP_AUDIT_MAX_BYTES:-10485760}
      MCP_AUDIT_KEEP: ${MCP_AUDIT_KEEP:-12}
      MCP_AUDIT_ROTATE_SECONDS: ${MCP_AUDIT_ROTATE_SECONDS:-3600}
    volumes:
      - audit:/var/log/mcp-correo
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  # La auditoría: un JSONL por llamada.
  audit:
  # La base de datos: dominios y cuentas, con las contraseñas cifradas.
  # Sin este volumen el contenedor es de solo lectura y las cuentas se
  # perderían en cada reinicio.
  data:

# Red externa de un Traefik ya creado. Descomenta junto con las etiquetas.
# networks:
#   proxy:
#     external: true
#     name: proxy
