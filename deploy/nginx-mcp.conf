# /etc/nginx/conf.d/mcp.vyrts.com.conf
# TLS, rate limit y proxy hacia el MCP en loopback. No publica ningún otro path.

limit_req_zone $binary_remote_addr zone=mcp:10m rate=60r/m;

server {
    listen 80;
    server_name mcp.vyrts.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.vyrts.com;

    ssl_certificate     /etc/letsencrypt/live/mcp.vyrts.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.vyrts.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    access_log /var/log/nginx/mcp.access.log;

    location = /mcp {
        limit_req zone=mcp burst=20 nodelay;
        limit_req_status 429;

        # Allowlist opcional, cuando se conozcan las IP de salida del cliente:
        # allow 203.0.113.10;
        # deny all;

        proxy_pass http://127.0.0.1:8765/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / { return 404; }
}
